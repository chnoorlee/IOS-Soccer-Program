workflows:
  # ── 每次 push 自动编译 + 单元测试 ──
  sports-hub-build-test:
    name: SportsHub Build & Test
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: xcodegen generate

      - name: Build SportsHub
        script: |
          set -o pipefail
          xcodebuild build \
            -project SportsHub.xcodeproj \
            -scheme SportsHub \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log

      - name: Run unit tests
        script: |
          set -o pipefail
          TEST_DERIVED_DATA="$PWD/build/test-derived-data"
          TEST_APP="$TEST_DERIVED_DATA/Build/Products/Debug-iphonesimulator/SportsHub.app"
          WIDGET_EXTENSION="$TEST_APP/PlugIns/SportsHubWidgets.appex"

          xcodebuild build-for-testing \
            -project SportsHub.xcodeproj \
            -scheme SportsHub \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -configuration Debug \
            -only-testing:SportsHubTests \
            -derivedDataPath "$TEST_DERIVED_DATA" 2>&1 | tee test.log

          WIDGET_EXTENSION_POINT=$(
            /usr/libexec/PlistBuddy \
              -c 'Print :NSExtension:NSExtensionPointIdentifier' \
              "$WIDGET_EXTENSION/Info.plist"
          )
          if [[ "$WIDGET_EXTENSION_POINT" != "com.apple.widgetkit-extension" ]]; then
            echo "Invalid WidgetKit extension point: $WIDGET_EXTENSION_POINT" | tee -a test.log
            exit 1
          fi

          # Xcode 26.4 Simulator cannot install this unit-test host while its
          # otherwise-valid WidgetKit extension is embedded. The preceding
          # build still compiles and validates the extension; only the
          # disposable test host is adjusted before installation.
          mkdir -p build/test-host-extensions
          mv "$WIDGET_EXTENSION" build/test-host-extensions/
          codesign \
            --force \
            --sign - \
            --preserve-metadata=identifier,entitlements,flags,runtime \
            --timestamp=none \
            "$TEST_APP"

          xcodebuild test-without-building \
            -project SportsHub.xcodeproj \
            -scheme SportsHub \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -configuration Debug \
            -only-testing:SportsHubTests \
            -derivedDataPath "$TEST_DERIVED_DATA" \
            -resultBundlePath TestResults.xcresult 2>&1 | tee -a test.log

      - name: Check test results
        script: |
          if grep -Eq '\*\* TEST (EXECUTE )?SUCCEEDED \*\*' test.log; then
            echo "All tests passed"
          else
            echo "Tests failed - check test.log"
            exit 1
          fi

    artifacts:
      - build.log
      - test.log
      - TestResults.xcresult

  # ── 手动触发：归档 IPA 用于真机/TestFlight ──
  sports-hub-archive:
    name: SportsHub Archive (IPA)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: xcodegen generate

      - name: Build archive
        script: |
          xcodebuild archive \
            -project SportsHub.xcodeproj \
            -scheme SportsHub \
            -sdk iphoneos \
            -archivePath build/SportsHub.xcarchive \
            -configuration Release

      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath build/SportsHub.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist codemagic-export.plist

    artifacts:
      - build/ipa/*.ipa
