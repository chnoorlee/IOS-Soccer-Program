workflows:
  # ── 每次 push 自动编译 + 单元测试 ──
  sports-hub-build-test:
    name: SportsHub Build & Test
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: xcodegen generate

      - name: Build SportsHub
        script: |
          set -o pipefail
          xcodebuild build \
            -project SportsHub.xcodeproj \
            -scheme SportsHub \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log

      - name: Run unit tests
        script: |
          set -o pipefail
          xcodebuild test \
            -project SportsHub.xcodeproj \
            -scheme SportsHub \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -configuration Debug \
            -only-testing:SportsHubTests \
            -resultBundlePath TestResults.xcresult 2>&1 | tee test.log

      - name: Check test results
        script: |
          if grep -q "\\*\\* TEST SUCCEEDED \\*\\*" test.log; then
            echo "All tests passed"
          else
            echo "Tests failed - check test.log"
            exit 1
          fi

    artifacts:
      - build.log
      - test.log
      - TestResults.xcresult

  # ── 手动触发：归档 IPA 用于真机/TestFlight ──
  sports-hub-archive:
    name: SportsHub Archive (IPA)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: xcodegen generate

      - name: Build archive
        script: |
          xcodebuild archive \
            -project SportsHub.xcodeproj \
            -scheme SportsHub \
            -sdk iphoneos \
            -archivePath build/SportsHub.xcarchive \
            -configuration Release

      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath build/SportsHub.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist codemagic-export.plist

    artifacts:
      - build/ipa/*.ipa
