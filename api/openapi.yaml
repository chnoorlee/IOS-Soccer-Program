              items:
                $ref: '#/components/schemas/NamedValue'

    NamedValue:
      type: object
      additionalProperties: false
      required: [name, value]
      properties:
        name:
          type: string
        value:
          type: number

    Transfer:
      type: object
      additionalProperties: false
      required: [id, player, transferDate, status]
      properties:
        id:
          type: string
        player:
          $ref: '#/components/schemas/PlayerSummary'
        fromTeam:
          oneOf:
            - $ref: '#/components/schemas/TeamSummary'
            - type: 'null'
        toTeam:
          oneOf:
            - $ref: '#/components/schemas/TeamSummary'
            - type: 'null'
        transferDate:
          type: string
          format: date
        status:
          type: string
          enum: [RUMORED, AGREED, COMPLETED]

    TransferListResponse:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Transfer'
        page:
          $ref: '#/components/schemas/PageInfo'

    SeasonCalendarEvent:
      type: object
      additionalProperties: false
      required: [id, title, detail, startsAt, endsAt, kind, competition]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        title:
          $ref: '#/components/schemas/SeasonCalendarTitle'
        detail:
          oneOf:
            - $ref: '#/components/schemas/SeasonCalendarDetail'
            - type: 'null'
        startsAt:
          type: string
          format: date-time
          description: Must fall inside the inclusive provider window.
        endsAt:
          type: [string, 'null']
          format: date-time
          description: Null for a point event; otherwise no earlier than startsAt and at most 120 days later.
        kind:
          type: string
          enum: [COMPETITION_MILESTONE, DRAW, TRANSFER_WINDOW, INTERNATIONAL_BREAK, OTHER]
        competition:
          oneOf:
            - $ref: '#/components/schemas/CompetitionSummary'
            - type: 'null'

    SeasonCalendarData:
      type: object
      additionalProperties: false
      required: [rangeStart, rangeEnd, updatedAt, sourceName, events]
      properties:
        rangeStart:
          type: string
          format: date-time
        rangeEnd:
          type: string
          format: date-time
          description: Later than rangeStart and no more than 400 days after it.
        updatedAt:
          type: string
          format: date-time
        sourceName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[^\u0000-\u001F\u007F-\u009F]+$'
        events:
          type: array
          maxItems: 200
          description: Unique events ordered by startsAt ascending then id ascending.
          items:
            $ref: '#/components/schemas/SeasonCalendarEvent'

    SeasonCalendarTitle:
      type: object
      additionalProperties: false
      required: [ar, en]
      properties:
        ar:
          type: string
          minLength: 1
          maxLength: 160
          pattern: '^[^\u0000-\u001F\u007F-\u009F]+$'
        en:
          type: string
          minLength: 1
          maxLength: 160
          pattern: '^[^\u0000-\u001F\u007F-\u009F]+$'

    SeasonCalendarDetail:
      type: object
      additionalProperties: false
      required: [ar, en]
      properties:
        ar:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '^[^\u0000-\u001F\u007F-\u009F]+$'
        en:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '^[^\u0000-\u001F\u007F-\u009F]+$'

    SeasonCalendarResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/SeasonCalendarData'

    CompetitionListResponse:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CompetitionSummary'
        page:
          $ref: '#/components/schemas/PageInfo'

    StandingRow:
      type: object
      additionalProperties: false
      required: [rank, team, played, won, drawn, lost, goalsFor, goalsAgainst, points]
      properties:
        rank:
          type: integer
          minimum: 1
        team:
          $ref: '#/components/schemas/TeamSummary'
        played: { type: integer, minimum: 0 }
        won: { type: integer, minimum: 0 }
        drawn: { type: integer, minimum: 0 }
        lost: { type: integer, minimum: 0 }
        goalsFor: { type: integer, minimum: 0 }
        goalsAgainst: { type: integer, minimum: 0 }
        points: { type: integer }
        form:
          type: array
          maxItems: 5
          items:
            type: string
            enum: [WIN, DRAW, LOSS]

    StandingGroup:
      type: object
      additionalProperties: false
      required: [groupName, rows]
      properties:
        groupName:
          $ref: '#/components/schemas/LocalizedText'
        rows:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/StandingRow'

    StandingsResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StandingGroup'

    FixtureStandingsData:
      type: object
      additionalProperties: false
      required: [fixtureId, competition, season, standings, source, updatedAt]
      properties:
        fixtureId:
          type: string
          minLength: 1
        competition:
          $ref: '#/components/schemas/CompetitionSummary'
        season:
          $ref: '#/components/schemas/SeasonSummary'
        standings:
          type: array
          description: Full ordered table; empty when this competition has no standings.
          items:
            $ref: '#/components/schemas/StandingGroup'
        source:
          $ref: '#/components/schemas/DataSource'
        updatedAt:
          type: string
          format: date-time

    FixtureStandingsResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/FixtureStandingsData'

    FixtureHeadToHeadData:
