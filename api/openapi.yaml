    VideoPosterMedia:
      type: object
      additionalProperties: false
      description: |
        Publisher-authorized public video-identification image metadata.
        Inclusion is an upstream display-rights assertion, not a playback
        entitlement or a licence the client can independently prove. The URL
        resolves directly without redirects and never requires caller identity.
      required: [id, url, contentType, width, height, altText, credit]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        url:
          type: string
          format: uri
          pattern: '^https://[^/@:#?]+/[^/?#][^#]*$'
          maxLength: 2048
          description: Direct public CDN URL. Credentials, fragments and custom ports are forbidden.
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp, image/heic, image/heif]
        width:
          type: integer
          minimum: 640
          maximum: 4096
        height:
          type: integer
          minimum: 360
          maximum: 4096
        altText:
          $ref: '#/components/schemas/VideoPosterAlternativeText'
        credit:
          $ref: '#/components/schemas/VideoPosterCredit'

