        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /me/follows/{followId}:
    delete:
      operationId: deleteMyFollow
      tags: [Account]
      summary: Remove a follow. Deleting an absent follow is also successful.
