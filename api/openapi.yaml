openapi: 3.1.0
info:
  title: SportsHub Public API
  version: 1.0.0-draft
  summary: Vendor-neutral sports, editorial, media and personalization API.
  description: |
    Contract for the SportsHub iOS app. Every resource ID belongs to SportsHub;
    third-party provider identifiers and payloads are private implementation details.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.example.invalid/v1
    description: Reserved placeholder. Replace only after an authorized backend exists.
security:
  - {}
  - bearerAuth: []
tags:
  - name: Home
    description: Personalized or guest home snapshots.
  - name: Fixtures
    description: Schedules, match centers and realtime fixture events.
  - name: Competitions
    description: Competition metadata, standings and leaders.
  - name: Teams
    description: Clubs, national teams and squads.
  - name: Players
    description: Player profiles and transfer history.
  - name: Transfers
    description: Provider-authoritative global transfer updates with explicit status labels.
  - name: Calendar
    description: Provider-authored important dates across an atomic season window.
  - name: Editorial
    description: News articles and long-form editorial content.
  - name: Video
    description: Rights-aware video metadata and playback authorization.
  - name: Search
    description: Cross-resource discovery.
  - name: Account
    description: Authenticated follows, notification preferences and progress.
  - name: Community
    description: Moderated comments and reactions.
  - name: Predictions
    description: Region-eligible, non-wager prediction games.

paths:
  /home:
    get:
      operationId: getHome
      tags: [Home]
      summary: Get the personalized home snapshot.
      description: Returns a stable snapshot. Authentication is optional; guests receive an editorial default.
      x-sportshub-stage: core
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Home snapshot.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              schema: { type: string }
              description: Authenticated variants must be `private, no-store`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeResponse'
        '304':
          $ref: '#/components/responses/NotModified'
        default:
          $ref: '#/components/responses/Problem'

  /fixtures:
    get:
      operationId: listFixtures
      tags: [Fixtures]
      summary: List fixtures for a local match day.
      x-sportshub-stage: core
      parameters:
        - name: date
          in: query
          required: true
          description: Calendar date interpreted in `timeZone`.
          schema:
            type: string
            format: date
        - name: timeZone
          in: query
          required: true
          description: IANA time-zone identifier, for example `Asia/Riyadh`.
          schema:
            type: string
            minLength: 1
        - name: competitionId
          in: query
          schema:
            type: string
        - name: teamId
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            $ref: '#/components/schemas/FixtureState'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Fixture page.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixtureListResponse'
        '304':
          $ref: '#/components/responses/NotModified'
        default:
          $ref: '#/components/responses/Problem'

  /fixtures/{fixtureId}:
    get:
      operationId: getFixture
      tags: [Fixtures]
      summary: Get a match-centre snapshot.
      x-sportshub-stage: core
      parameters:
        - $ref: '#/components/parameters/FixtureID'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Fixture detail with current events, lineups and statistics.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixtureDetailResponse'
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /fixtures/{fixtureId}/events:
    get:
      operationId: listFixtureEvents
      tags: [Fixtures]
      summary: Get incremental score and event mutations.
      description: |
        `afterRevision` is an exclusive cursor in one monotonic, per-fixture
        revision sequence. `data` is ordered by revision and contains event
        insertions, corrections under a stable event ID, or deletion tombstones.
        The latest fixture snapshot carries score and state changes even when
        `data` is empty. Clients must not persist or demo-fallback this response.
      x-sportshub-stage: core
      parameters:
        - $ref: '#/components/parameters/FixtureID'
        - name: afterRevision
          in: query
          required: true
          description: Return mutations strictly newer than this fixture revision.
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Ordered mutations and the latest fixture revision.
          headers:
            Cache-Control:
              schema: { type: string }
              description: Must be `no-store`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixtureEventsResponse'
        default:
          $ref: '#/components/responses/Problem'

  /fixtures/{fixtureId}/standings:
    get:
      operationId: getFixtureStandings
      tags: [Fixtures]
      summary: Get the confirmed-season standings for a fixture.
      description: |
        Resolves the fixture's competition and season on the server. Clients
        must display the returned season and must not infer it from the
        competition's current season. Empty standings are a valid response.
      x-sportshub-stage: core
      parameters:
        - $ref: '#/components/parameters/FixtureID'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Fixture-scoped standings with explicit season and provenance.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixtureStandingsResponse'
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /fixtures/{fixtureId}/head-to-head:
    get:
      operationId: getFixtureHeadToHead
      tags: [Fixtures]
      summary: Get recent completed meetings between the fixture's teams.
      description: |
        Returns completed meetings across all competitions, ordered by
        `kickoffAt` descending and then stable fixture ID ascending. The current
        fixture is excluded. This history is descriptive and is not a prediction.
      x-sportshub-stage: core
      parameters:
        - $ref: '#/components/parameters/FixtureID'
        - name: limit
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Recent completed meetings with team identity and provenance.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixtureHeadToHeadResponse'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /fixtures/{fixtureId}/content:
    get:
      operationId: getFixtureContent
      tags: [Fixtures, Editorial, Video]
      summary: Get rights-filtered editorial metadata explicitly scoped to a fixture.
      description: >-
        Returns the server-authoritative fixture association used by the match centre.
        Provider order is significant. Clients must not infer a relationship by matching
        team names, titles or descriptions. Video metadata grants no playback entitlement.
      x-sportshub-stage: content
      parameters:
        - $ref: '#/components/parameters/FixtureID'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Bounded fixture content window.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixtureContentResponse'
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /fixtures/{fixtureId}/stream:
    get:
      operationId: streamFixtureEvents
      tags: [Fixtures]
      summary: Stream score and event changes with Server-Sent Events.
      description: |
        Event names are `fixture.snapshot`, `fixture.event.upsert`, `fixture.event.delete`,
        and `heartbeat`. Every data event carries an increasing fixture revision.
        Clients must reconnect with `Last-Event-ID` and replace data by stable event ID.
      x-sportshub-stage: core
      parameters:
        - $ref: '#/components/parameters/FixtureID'
        - name: Last-Event-ID
          in: header
          schema:
            type: string
      responses:
        '200':
          description: SSE stream.
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'

  /teams:
    get:
      operationId: listTeams
      tags: [Teams]
      summary: List teams available for following and search.
      x-sportshub-stage: core
      parameters:
        - name: competitionId
          in: query
          schema:
            type: string
        - name: query
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Team page.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamListResponse'
        '304':
          $ref: '#/components/responses/NotModified'
        default:
          $ref: '#/components/responses/Problem'

  /teams/match-snapshots:
    get:
      operationId: listTeamMatchSnapshots
      tags: [Teams, Matches]
      summary: Get one previous and one next match slot for an ordered team batch.
      description: >-
        Returns exactly one row per requested teamId in request order. The service
        selects the nearest eligible fixtures; clients must not infer these slots
        from titles or an unrelated fixtures feed.
      x-sportshub-stage: content
      parameters:
        - name: teamId
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 20
            uniqueItems: true
            items:
              type: string
              minLength: 1
              maxLength: 128
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Ordered team match snapshot batch.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMatchSnapshotListResponse'
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /teams/{teamId}:
    get:
      operationId: getTeam
      tags: [Teams]
      summary: Get a team channel and current season summary.
      x-sportshub-stage: content
      parameters:
        - $ref: '#/components/parameters/TeamID'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Team detail.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamDetailResponse'
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /teams/{teamId}/squad:
    get:
      operationId: listTeamSquad
      tags: [Teams]
      summary: List a team squad for a season.
      x-sportshub-stage: content
      parameters:
        - $ref: '#/components/parameters/TeamID'
        - name: seasonId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Squad.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerListResponse'
        default:
          $ref: '#/components/responses/Problem'

  /teams/{teamId}/content:
    get:
      operationId: getTeamContent
      tags: [Teams, Editorial, Video]
      summary: Get recent rights-filtered editorial metadata explicitly scoped to a team.
      description: >-
        Returns the server-authoritative team association used by the team channel.
        Clients must not infer related content by matching titles, descriptions or names.
      x-sportshub-stage: content
      parameters:
        - $ref: '#/components/parameters/TeamID'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Bounded team content window.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamContentResponse'
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /players:
    get:
      operationId: listPlayers
      tags: [Players]
      summary: List players available for following and search.
      x-sportshub-stage: core
      parameters:
        - name: query
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Player page.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerListResponse'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /players/{playerId}:
    get:
      operationId: getPlayer
      tags: [Players]
      summary: Get a player profile and season statistics.
      x-sportshub-stage: content
      parameters:
        - $ref: '#/components/parameters/PlayerID'
      responses:
        '200':
          description: Player detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerDetailResponse'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /players/{playerId}/transfers:
    get:
      operationId: listPlayerTransfers
      tags: [Players]
      summary: List verified player transfers newest first.
      x-sportshub-stage: content
      parameters:
        - $ref: '#/components/parameters/PlayerID'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Transfer page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferListResponse'
        default:
          $ref: '#/components/responses/Problem'

  /transfers:
    get:
      operationId: listTransferUpdates
      tags: [Transfers]
      summary: List global transfer updates newest first.
      description: >-
        Returns provider-authoritative transfer states. RUMORED is unconfirmed and
        clients must not present it as AGREED or COMPLETED.
      x-sportshub-stage: content
      parameters:
        - name: cursor
          in: query
          description: Opaque cursor returned by the previous transfer page.
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 512
            pattern: '^\S+$'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [RUMORED, AGREED, COMPLETED]
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Transfer update page.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferListResponse'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /season-calendar:
    get:
      operationId: getSeasonCalendar
      tags: [Calendar]
      summary: Get the provider-authored important dates for the current season window.
      description: >-
        Returns one atomic cross-competition calendar. Clients may filter the returned
        events but must not infer importance, confirmation, or replacement dates.
      x-sportshub-stage: content
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Important season dates ordered by startsAt ascending and ID ascending.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonCalendarResponse'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /players/{playerId}/content:
    get:
      operationId: getPlayerContent
      tags: [Players, Editorial, Video]
      summary: Get recent rights-filtered editorial metadata explicitly scoped to a player.
      description: >-
        Returns the server-authoritative player association. Clients must not infer
        related content from names, teams, statistics, titles, or descriptions.
      x-sportshub-stage: content
      parameters:
        - $ref: '#/components/parameters/PlayerID'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Bounded player content window.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerContentResponse'
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /competitions:
    get:
      operationId: listCompetitions
      tags: [Competitions]
      summary: List competitions and available seasons.
      x-sportshub-stage: content
      parameters:
        - name: sport
          in: query
          schema:
            $ref: '#/components/schemas/VideoSport'
            enum: [FOOTBALL, BASKETBALL, ESPORTS, MOTORSPORT, COMBAT, ARCHERY]
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Competition page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionListResponse'
        default:
          $ref: '#/components/responses/Problem'

  /competitions/{competitionId}/standings:
    get:
      operationId: getCompetitionStandings
      tags: [Competitions]
      summary: Get an ordered standings table.
      x-sportshub-stage: content
      parameters:
        - $ref: '#/components/parameters/CompetitionID'
        - name: seasonId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Standings groups and rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandingsResponse'
        default:
          $ref: '#/components/responses/Problem'

  /competitions/{competitionId}/content:
    get:
      operationId: getCompetitionContent
      tags: [Competitions, Editorial, Video]
      summary: Get recent rights-filtered editorial metadata explicitly scoped to a competition.
      description: >-
        Returns a season-independent, server-authoritative competition association.
        Clients must not infer related content from names, teams, titles, or descriptions.
      x-sportshub-stage: content
      parameters:
        - $ref: '#/components/parameters/CompetitionID'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Bounded competition content window.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionContentResponse'
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /competitions/{competitionId}/leaders:
    get:
      operationId: listCompetitionLeaders
      tags: [Competitions]
      summary: List scorers, assists or cards.
      x-sportshub-stage: content
      parameters:
        - $ref: '#/components/parameters/CompetitionID'
        - name: seasonId
          in: query
          required: true
          schema:
            type: string
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [GOALS, ASSISTS, YELLOW_CARDS, RED_CARDS]
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Leader page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderListResponse'
        default:
          $ref: '#/components/responses/Problem'

  /competitions/{competitionId}/fixtures:
    get:
      operationId: listCompetitionFixtures
      tags: [Competitions, Fixtures]
      summary: List the complete fixture schedule for one competition season.
      description: |
        Pages form one globally ordered sequence by `kickoffAt` ascending and
        stable fixture ID ascending for equal kickoff times. Every fixture must
        belong to `competitionId`; the response echoes both requested scope IDs.
      x-sportshub-stage: content
      parameters:
        - $ref: '#/components/parameters/CompetitionID'
        - name: seasonId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: A season-scoped fixture page.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionFixtureListResponse'
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /articles:
    get:
      operationId: listArticles
      tags: [Editorial]
      summary: List published articles.
      x-sportshub-stage: content
      parameters:
        - name: teamId
          in: query
          schema:
            type: string
        - name: competitionId
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/ArticleCategory'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Article page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleListResponse'
        default:
          $ref: '#/components/responses/Problem'

  /articles/{articleId}:
    get:
      operationId: getArticle
      tags: [Editorial]
      summary: Get a published article, correction state and rights-safe visual reporting.
      description: |
        Structured visual briefs contain semantic bilingual text only. They do not carry
        arbitrary HTML, SVG, remote assets or inferred third-party rights.
      x-sportshub-stage: content
      parameters:
        - $ref: '#/components/parameters/ArticleID'
      responses:
        '200':
          description: Article detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleDetailResponse'
        '404':
          $ref: '#/components/responses/Problem'
        '410':
          description: Article withdrawn.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /articles/{articleId}/comments:
    get:
      operationId: listArticleComments
      tags: [Community]
      summary: List moderated comments.
      x-sportshub-stage: community
      parameters:
        - $ref: '#/components/parameters/ArticleID'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Comment page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentListResponse'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createArticleComment
