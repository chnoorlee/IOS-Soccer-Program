    LeaderListResponse:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Leader'
        page:
          $ref: '#/components/schemas/PageInfo'

    ArticleListResponse:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ArticleSummary'
        page:
          $ref: '#/components/schemas/PageInfo'

    ArticleDetailResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/ArticleSummary'
            - type: object
              required: [body, revision, visualBrief]
              properties:
                body:
                  $ref: '#/components/schemas/LocalizedText'
                revision:
                  type: integer
                  minimum: 1
                visualBrief:
                  oneOf:
                    - $ref: '#/components/schemas/ArticleVisualBrief'
                    - type: 'null'
                  description: |
                    Required and non-null when format is VISUAL_BRIEF; required and null when
                    format is STORY. Clients reject mismatched pairs before caching.
              allOf:
                - if:
                    properties:
                      format:
                        const: VISUAL_BRIEF
                    required: [format]
                  then:
                    properties:
                      visualBrief:
