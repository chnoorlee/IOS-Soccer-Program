  /search:
    get:
      operationId: search
      tags: [Search]
      summary: Search localized aliases across content and sports entities.
      description: |
        Searches Unicode-normalized Arabic and English titles, approved aliases, and
        searchable copy. Leading and trailing whitespace is ignored for validation.
        Arabic matching removes tatweel and combining marks, normalizes Alef variants
        and Alef Maqsura, and does not transliterate scripts or conflate Taa Marbuta.
        The returned array is in server-authoritative relevance order; clients may
        filter that order by type but must not rerank it.
      x-sportshub-stage: content
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: types
          in: query
          description: Comma-separated result types.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/SearchResultType'
          style: form
          explode: false
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Search result page in server-authoritative relevance order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /auth/apple:
    post:
      operationId: signInWithApple
      tags: [Account]
      summary: Exchange a native Sign in with Apple credential for a SportsHub session.
      description: |
        The backend must verify the Apple identity-token signature, issuer, audience,
        expiry and nonce before creating or resuming an account. Client-supplied name
        and email are hints available only on Apple's first authorization.
      x-sportshub-stage: account
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleSignInRequest'
      responses:
        '200':
          description: Authenticated session with rotated server credentials.
          headers:
            Cache-Control:
              schema: { type: string }
              description: Must be `private, no-store`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [Account]
      summary: Rotate a refresh token and issue a fresh access token.
      description: Refresh tokens are one-time rotating credentials; reuse revokes the token family.
      x-sportshub-stage: account
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRefreshRequest'
      responses:
        '200':
          description: Refreshed session. Both tokens replace the previous pair.
          headers:
            Cache-Control:
              schema: { type: string }
              description: Must be `private, no-store`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /auth/logout:
    post:
      operationId: revokeSession
      tags: [Account]
      summary: Revoke the current refresh-token family and its push-device bindings.
      description: Notification-device registrations created by this refresh-token family are removed, including when the session is already absent from the client.
      x-sportshub-stage: account
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLogoutRequest'
      responses:
        '204':
          description: Session revoked or already absent.
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /me:
    get:
      operationId: getMe
      tags: [Account]
      summary: Get the authenticated account profile.
      x-sportshub-stage: account
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current account profile.
          headers:
            Cache-Control:
              schema: { type: string }
              description: Must be `private, no-store`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteMyAccount
      tags: [Account]
      summary: Permanently delete the authenticated SportsHub account.
      description: |
        A 204 response means deletion is complete, not merely scheduled. Before responding,
        the server deletes all account-associated data it is not legally required to retain,
        revokes every SportsHub session and notification-device registration, and revokes the
        user's Sign in with Apple grant through Apple's server API. Retrying an already completed
        deletion with the same idempotency key is safe.
      x-sportshub-stage: account
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Account and deletable associated data were permanently removed.
          headers:
            Cache-Control:
              schema: { type: string }
              description: Must be `private, no-store`.
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /me/guest-merge:
    post:
      operationId: mergeGuestPersonalization
      tags: [Account]
      summary: Merge device-local guest progress, saved videos, saved articles and follows into the account.
      description: |
        The server performs deterministic newest-updated-at-wins upserts. Retrying the
        same logical payload is safe even after an ambiguous network response. Video
        metadata, playback URLs, article bodies and article media are never accepted
        from the client.
      x-sportshub-stage: account
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestPersonalizationMergeRequest'
      responses:
        '200':
          description: Guest state merged into the account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestPersonalizationMergeResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

