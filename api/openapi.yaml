      responses:
        '204':
          description: Device registration created or replaced; no token is returned.
          headers:
            Cache-Control:
              schema: { type: string }
              description: Must be `private, no-store`.
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

