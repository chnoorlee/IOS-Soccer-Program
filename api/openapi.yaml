      x-sportshub-stage: account
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Saved article metadata.
          headers:
            Cache-Control:
              schema: { type: string }
              description: Must be `private, no-store`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleListResponse'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /me/article-favorites/{articleId}:
    get:
      operationId: getMyArticleFavorite
      tags: [Account]
      summary: Get whether one article is saved by the current user.
      x-sportshub-stage: account
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ArticleID'
      responses:
        '200':
          description: Current article favorite state.
          headers:
            Cache-Control:
              schema: { type: string }
              description: Must be `private, no-store`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleFavoriteResponse'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: putMyArticleFavorite
      tags: [Account]
      summary: Save a published article. Saving an already saved article is also successful.
      description: A withdrawn article cannot be newly saved.
      x-sportshub-stage: account
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ArticleID'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Article is saved.
          headers:
            Cache-Control:
              schema: { type: string }
              description: Must be `private, no-store`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleFavoriteResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteMyArticleFavorite
      tags: [Account]
      summary: Remove a saved article. Deleting an absent favorite is also successful.
      x-sportshub-stage: account
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ArticleID'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Article is not saved.
          headers:
            Cache-Control:
              schema: { type: string }
              description: Must be `private, no-store`.
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /me/video-favorites:
    get:
      operationId: listMyFavoriteVideos
      tags: [Account]
      summary: List the authenticated user's saved videos, newest first.
      x-sportshub-stage: account
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Saved video metadata.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Must be `private, no-store`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoListResponse'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /me/video-favorites/{videoId}:
    get:
      operationId: getMyVideoFavorite
      tags: [Account]
      summary: Get whether one video is saved by the current user.
      x-sportshub-stage: account
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VideoID'
      responses:
        '200':
          description: Current favorite state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoFavoriteResponse'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: putMyVideoFavorite
      tags: [Account]
      summary: Save a video. Saving an already saved video is also successful.
      x-sportshub-stage: account
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VideoID'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Video is saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoFavoriteResponse'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteMyVideoFavorite
      tags: [Account]
      summary: Remove a saved video. Deleting an absent favorite is also successful.
      x-sportshub-stage: account
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VideoID'
      responses:
        '204':
          description: Video is not saved.
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /prediction-games:
    get:
      operationId: listPredictionGames
      tags: [Predictions]
      summary: List region-eligible, non-wager prediction games.
      description: >-
        Returns at most 20 complete group-order challenges in Provider order. Games are free
        sports predictions and must not contain odds, stakes, entry fees, purchase advantages
        or cash value. Personal entries are never included in this public cacheable response.
      x-sportshub-stage: growth
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Prediction games.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionGameListResponse'
        '304':
          $ref: '#/components/responses/NotModified'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /prediction-games/{gameId}/entries/me:
    get:
      operationId: getMyPredictionEntry
      tags: [Predictions]
      summary: Get the authenticated user's complete entry for one game.
      description: Private account state. This response is never cached or demo-fallback data.
      x-sportshub-stage: growth
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Saved complete prediction entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionEntryResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: putMyPredictionEntry
      tags: [Predictions]
      summary: Create or replace the user's complete entry before the lock time.
      description: >-
        The request must rank every current group and every team exactly once. Both game state
        and lockAt are enforced server-side. Retrying the same complete ranking with the same
        idempotency key is safe. This is a free non-wager action.
      x-sportshub-stage: growth
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictionEntryInput'
      responses:
        '200':
          description: Stored prediction entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionEntryResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  headers:
    ETag:
      description: Opaque representation validator.
      schema:
        type: string
    RequestID:
      description: Correlation identifier for support and logs.
      schema:
        type: string

  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned by the previous page.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
        pattern: '^\S+$'
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    VideoProgramLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    IfNoneMatch:
      name: If-None-Match
      in: header
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    FixtureID:
      name: fixtureId
      in: path
      required: true
      schema:
        type: string
    TeamID:
      name: teamId
      in: path
      required: true
      schema:
        type: string
    PlayerID:
      name: playerId
      in: path
      required: true
      schema:
        type: string
    CompetitionID:
      name: competitionId
      in: path
      required: true
      schema:
        type: string
    ArticleID:
      name: articleId
      in: path
      required: true
      schema:
        type: string
    VideoID:
      name: videoId
      in: path
      required: true
      schema:
        type: string
    VideoProgramID:
      name: programId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[^/\\?#\x00-\x1F\x7F]+$'

  responses:
    NotModified:
      description: The cached representation is current.
    Problem:
      description: Request failed. The HTTP status and stable problem code explain why.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    LocalizedText:
      type: object
      additionalProperties: false
      required: [ar, en]
      properties:
        ar:
          type: string
          minLength: 1
        en:
          type: string
          minLength: 1

    PageInfo:
      type: object
      additionalProperties: false
      required: [hasMore]
      properties:
        nextCursor:
          type: [string, 'null']
        hasMore:
          type: boolean

    AppleSignInRequest:
      type: object
      additionalProperties: false
      required: [identityToken, authorizationCode, rawNonce]
      properties:
        identityToken:
          type: string
          minLength: 16
          maxLength: 16384
        authorizationCode:
          type: string
          minLength: 8
          maxLength: 8192
        rawNonce:
          type: string
          minLength: 32
          maxLength: 128
        givenName:
          type: [string, 'null']
          maxLength: 100
        familyName:
          type: [string, 'null']
          maxLength: 100
        email:
          type: [string, 'null']
          format: email
          maxLength: 320

    AuthRefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 16
          maxLength: 16384

    AuthLogoutRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 16
          maxLength: 16384

    AuthUser:
      type: object
      additionalProperties: false
      required: [id, displayName, createdAt]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: [string, 'null']
          format: email
          maxLength: 320
        createdAt:
          type: string
          format: date-time

    AuthSession:
      type: object
      additionalProperties: false
      required:
        - user
        - accessToken
        - refreshToken
        - accessTokenExpiresAt
        - refreshTokenExpiresAt
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        accessToken:
          type: string
          minLength: 16
          maxLength: 16384
        refreshToken:
          type: string
          minLength: 16
          maxLength: 16384
        accessTokenExpiresAt:
          type: string
          format: date-time
          description: No more than one hour after issuance; production policy should target 15–30 minutes.
        refreshTokenExpiresAt:
          type: string
          format: date-time
          description: No more than 90 days after issuance and later than the access-token expiry.

    AuthSessionResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AuthSession'

    AuthUserResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AuthUser'

    GuestWatchProgressInput:
      type: object
      additionalProperties: false
      required: [videoId, positionSeconds, completed, updatedAt]
      properties:
        videoId:
          type: string
          minLength: 1
          maxLength: 128
        positionSeconds:
          type: integer
          minimum: 0
        completed:
          type: boolean
        updatedAt:
          type: string
          format: date-time

    GuestVideoFavoriteInput:
      type: object
      additionalProperties: false
      required: [videoId, updatedAt]
      properties:
        videoId:
          type: string
          minLength: 1
          maxLength: 128
        updatedAt:
          type: string
          format: date-time

    GuestArticleFavoriteInput:
      type: object
      additionalProperties: false
      required: [articleId, updatedAt]
      properties:
        articleId:
          type: string
          minLength: 1
          maxLength: 128
        updatedAt:
          type: string
          format: date-time

    GuestFollowInput:
      type: object
      additionalProperties: false
      required: [type, entityId, updatedAt]
      properties:
        type:
          $ref: '#/components/schemas/FollowType'
        entityId:
          type: string
          minLength: 1
          maxLength: 128
        updatedAt:
          type: string
          format: date-time

    GuestPersonalizationMergeRequest:
      type: object
      additionalProperties: false
      required: [watchProgress, videoFavorites, articleFavorites, follows]
      properties:
        watchProgress:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/GuestWatchProgressInput'
        videoFavorites:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/GuestVideoFavoriteInput'
        articleFavorites:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/GuestArticleFavoriteInput'
        follows:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/GuestFollowInput'

    GuestPersonalizationMergeResponse:
      type: object
      additionalProperties: false
      required: [data]
      description: Every submitted record is counted exactly once across the five result fields.
      properties:
        data:
          type: object
          additionalProperties: false
          required: [progressUpserted, favoritesUpserted, articleFavoritesUpserted, followsUpserted, serverNewerRetained]
          properties:
            progressUpserted:
              type: integer
              minimum: 0
            favoritesUpserted:
              type: integer
              minimum: 0
            articleFavoritesUpserted:
              type: integer
              minimum: 0
            followsUpserted:
              type: integer
              minimum: 0
            serverNewerRetained:
              type: integer
              minimum: 0

    MediaAsset:
      type: object
      additionalProperties: false
      required: [id, kind, url, altText]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [IMAGE, POSTER, THUMBNAIL, LOGO]
        url:
          type: string
          format: uri
        altText:
          $ref: '#/components/schemas/LocalizedText'
        width:
          type: [integer, 'null']
          minimum: 1
        height:
          type: [integer, 'null']
          minimum: 1
        expiresAt:
          type: [string, 'null']
          format: date-time

    TeamSummary:
      type: object
      additionalProperties: false
      required: [id, name, monogram]
      properties:
        id:
          type: string
          minLength: 1
        name:
          $ref: '#/components/schemas/LocalizedText'
        monogram:
          type: string
          minLength: 1
          maxLength: 5
        accentColorHex:
          type: [string, 'null']
          pattern: '^[0-9A-Fa-f]{6}$'
        logo:
          oneOf:
            - $ref: '#/components/schemas/MediaAsset'
            - type: 'null'

    SeasonSummary:
      type: object
      additionalProperties: false
      required: [id, name, startDate, endDate, isCurrent]
      properties:
        id:
          type: string
          minLength: 1
        name:
          $ref: '#/components/schemas/LocalizedText'
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        isCurrent:
          type: boolean

    CompetitionSummary:
      type: object
      additionalProperties: false
      required: [id, name, sport]
      properties:
        id:
          type: string
        name:
          $ref: '#/components/schemas/LocalizedText'
        sport:
          type: string
          enum: [FOOTBALL, BASKETBALL, ESPORTS, MOTORSPORT, COMBAT, ARCHERY]
        currentSeasonId:
          type: [string, 'null']
          description: Stable ID of the current season when seasonal data is available.
        seasons:
          type: array
          maxItems: 50
          description: >-
            Provider-published seasons available to standings, leaders, fixtures and
            squad endpoints. IDs are unique and entries are ordered by startDate
            descending with ID ascending as a stable tie-break. If currentSeasonId is
            present, exactly one matching entry has isCurrent true; otherwise none do.
          items:
            $ref: '#/components/schemas/SeasonSummary'
          default: []
        logo:
          oneOf:
            - $ref: '#/components/schemas/MediaAsset'
            - type: 'null'

    FixtureState:
      type: string
      enum: [SCHEDULED, LIVE, HALF_TIME, FINISHED, POSTPONED, CANCELLED]

    Score:
      type: object
      additionalProperties: false
      required: [home, away]
      properties:
        home:
          type: integer
          minimum: 0
        away:
          type: integer
          minimum: 0

    Broadcast:
      type: object
      additionalProperties: false
      description: >-
        Read-only regional schedule metadata. It never grants playback, subscription or
        entitlement and intentionally contains no URL.
      required: [regionCode, channel]
      properties:
        regionCode:
          type: string
          pattern: '^[A-Z]{2}$'
          description: Two-letter uppercase region code supplied by the rights Provider.
        channel:
          $ref: '#/components/schemas/BroadcastLocalizedText'
        commentator:
          oneOf:
            - $ref: '#/components/schemas/BroadcastLocalizedText'
            - type: 'null'
        audioLanguageCode:
          type: [string, 'null']
          pattern: '^[a-z]{2,3}(-[A-Z]{2})?$'
          description: Canonical supported BCP-47 subset such as ar or en-GB.

    BroadcastLocalizedText:
      type: object
      additionalProperties: false
      required: [ar, en]
      description: Trimmed broadcast label text without Unicode control characters.
      properties:
        ar:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[^\u0000-\u001F\u007F-\u009F]*$'
        en:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[^\u0000-\u001F\u007F-\u009F]*$'

    FixtureSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - competition
        - homeTeam
        - awayTeam
        - kickoffAt
        - state
        - venue
        - revision
      properties:
        id:
          type: string
        competition:
          $ref: '#/components/schemas/CompetitionSummary'
        homeTeam:
          $ref: '#/components/schemas/TeamSummary'
        awayTeam:
          $ref: '#/components/schemas/TeamSummary'
        kickoffAt:
          type: string
          format: date-time
        state:
          $ref: '#/components/schemas/FixtureState'
        minute:
          type: [integer, 'null']
          minimum: 0
          maximum: 200
        score:
          oneOf:
            - $ref: '#/components/schemas/Score'
            - type: 'null'
        venue:
          $ref: '#/components/schemas/LocalizedText'
        broadcasts:
          type: array
          maxItems: 12
          description: >-
            Provider order. Omission is backward-compatible and maps to an empty client array;
            cancelled and postponed fixtures must return no listings.
          items:
            $ref: '#/components/schemas/Broadcast'
          default: []
        revision:
          type: integer
          minimum: 0
          description: Monotonic revision in the parent fixture's global sequence.

    ArticleCategory:
      type: string
      enum: [BREAKING, ANALYSIS, STATISTICS, TRANSFERS, INTERVIEW, MATCH_REPORT]

    ArticleFormat:
      type: string
      enum: [STORY, VISUAL_BRIEF]

    ArticleVisualSectionKind:
      type: string
      enum: [METRIC_GRID, COMPARISON, SEQUENCE]

    ArticleVisualValue:
      type: object
      additionalProperties: false
      required: [ar, en]
      properties:
        ar:
          type: string
          minLength: 1
          maxLength: 32
        en:
          type: string
          minLength: 1
          maxLength: 32

    ArticleVisualLabel:
      type: object
      additionalProperties: false
      required: [ar, en]
      properties:
        ar:
          type: string
          minLength: 1
          maxLength: 80
        en:
          type: string
          minLength: 1
          maxLength: 80

    ArticleVisualTitle:
      type: object
      additionalProperties: false
      required: [ar, en]
      properties:
        ar:
          type: string
          minLength: 1
          maxLength: 100
        en:
          type: string
          minLength: 1
          maxLength: 100

    ArticleVisualDetail:
      type: object
      additionalProperties: false
      required: [ar, en]
      properties:
        ar:
          type: string
          minLength: 1
          maxLength: 160
        en:
          type: string
          minLength: 1
          maxLength: 160

    ArticleVisualSourceNote:
      type: object
      additionalProperties: false
      required: [ar, en]
      properties:
        ar:
          type: string
          minLength: 1
          maxLength: 200
        en:
          type: string
          minLength: 1
          maxLength: 200

    ArticleVisualItem:
      type: object
      additionalProperties: false
      required: [id, value, label]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          description: Unique across every item in this visual brief.
        value:
          $ref: '#/components/schemas/ArticleVisualValue'
        label:
          $ref: '#/components/schemas/ArticleVisualLabel'
        detail:
          oneOf:
            - $ref: '#/components/schemas/ArticleVisualDetail'
            - type: 'null'

    ArticleVisualSection:
      type: object
      additionalProperties: false
      required: [id, kind, title, items]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          description: Unique within this visual brief.
        kind:
          $ref: '#/components/schemas/ArticleVisualSectionKind'
        title:
          $ref: '#/components/schemas/ArticleVisualTitle'
        items:
          type: array
          minItems: 2
          maxItems: 6
          items:
            $ref: '#/components/schemas/ArticleVisualItem'
      allOf:
        - if:
            properties:
              kind:
                const: COMPARISON
            required: [kind]
          then:
            properties:
              items:
                minItems: 2
                maxItems: 2

    ArticleVisualBrief:
      type: object
      additionalProperties: false
      required: [title, sourceNote, sections]
      properties:
        title:
          $ref: '#/components/schemas/ArticleVisualTitle'
        sourceNote:
          $ref: '#/components/schemas/ArticleVisualSourceNote'
        sections:
          type: array
          minItems: 1
          maxItems: 4
          description: Provider order; section IDs and all nested item IDs must be unique.
          items:
            $ref: '#/components/schemas/ArticleVisualSection'

    ArticleEngagementSummary:
      type: object
      additionalProperties: false
      description: |
        Viewer-neutral public snapshot for article cards. Totals may lag the
        uncached community endpoints; publishedComments excludes pending,
        rejected and removed comments. This object never contains caller state
        or share analytics.
      required: [totalReactions, publishedComments]
      properties:
        totalReactions:
          type: integer
          minimum: 0
          maximum: 2000000000
        publishedComments:
          type: integer
          minimum: 0
          maximum: 2000000000

    ArticleHeroMedia:
      type: object
      additionalProperties: false
      description: |
        Publisher-authorized public article image metadata. Inclusion is an
        upstream rights assertion, not a licence the client can independently
        prove. The URL must resolve directly without redirects and image bytes
        never require caller identity or authorization.
      required: [id, url, contentType, width, height, altText, credit]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        url:
          type: string
          format: uri
          pattern: '^https://[^/@:#?]+/[^/?#][^#]*$'
          maxLength: 2048
          description: Direct public CDN URL. Credentials, fragments and custom ports are forbidden.
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp, image/heic, image/heif]
        width:
          type: integer
          minimum: 640
          maximum: 4096
        height:
          type: integer
          minimum: 360
          maximum: 4096
        altText:
          $ref: '#/components/schemas/ArticleHeroAlternativeText'
        credit:
          $ref: '#/components/schemas/ArticleHeroCredit'

    ArticleHeroAlternativeText:
      type: object
      additionalProperties: false
      description: Bilingual image-specific alternative text.
      required: [ar, en]
      properties:
        ar:
          type: string
          minLength: 1
          maxLength: 180
        en:
          type: string
          minLength: 1
          maxLength: 180

    ArticleHeroCredit:
      type: object
      additionalProperties: false
      description: Bilingual visible publisher or photographer credit.
      required: [ar, en]
      properties:
        ar:
          type: string
          minLength: 1
          maxLength: 120
        en:
          type: string
          minLength: 1
          maxLength: 120

    ArticleSummary:
      type: object
      additionalProperties: false
      required: [id, title, summary, source, publishedAt, category, format, engagement, heroMedia]
      properties:
        id:
          type: string
        title:
          $ref: '#/components/schemas/LocalizedText'
        summary:
          $ref: '#/components/schemas/LocalizedText'
        source:
          type: string
          minLength: 1
        publishedAt:
          type: string
          format: date-time
        category:
          $ref: '#/components/schemas/ArticleCategory'
        format:
          allOf:
            - $ref: '#/components/schemas/ArticleFormat'
          default: STORY
          description: Older clients treat an omitted value as STORY during rolling deployment.
        engagement:
          allOf:
            - $ref: '#/components/schemas/ArticleEngagementSummary'
          description: |
            Required in current responses. Rolling-deployment clients tolerate
            an omitted value and hide the summary rather than treating it as zero.
        heroMedia:
          oneOf:
            - $ref: '#/components/schemas/ArticleHeroMedia'
            - type: 'null'
          description: |
            Required as an explicit object or null in current responses.
            Rolling-deployment clients tolerate omission and show their original
            category cover. Metadata must also satisfy at most 16 megapixels and
            an aspect ratio from 1.2 through 2.4 before cache insertion.
        correctionStatus:
          type: string
          enum: [ORIGINAL, CORRECTED]
          default: ORIGINAL

    HomeData:
      type: object
      additionalProperties: false
      required: [generatedAt, featuredFixtures, articles]
      properties:
        generatedAt:
          type: string
          format: date-time
        featuredFixtures:
          type: array
          items:
            $ref: '#/components/schemas/FixtureSummary'
        articles:
          type: array
          items:
            $ref: '#/components/schemas/ArticleSummary'
        featuredVideos:
          type: array
          items:
            $ref: '#/components/schemas/VideoSummary'
          default: []

    HomeResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/HomeData'

    TeamListResponse:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TeamSummary'
        page:
          $ref: '#/components/schemas/PageInfo'

    FixtureListResponse:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FixtureSummary'
        page:
          $ref: '#/components/schemas/PageInfo'

    CompetitionFixtureListResponse:
      type: object
      additionalProperties: false
      required: [competitionId, seasonId, data, page]
      properties:
        competitionId:
          type: string
          minLength: 1
          maxLength: 128
        seasonId:
          type: string
          minLength: 1
          maxLength: 128
        data:
          type: array
          description: Fixtures in the globally stable season order.
          items:
            $ref: '#/components/schemas/FixtureSummary'
        page:
          $ref: '#/components/schemas/PageInfo'

    FixtureEventType:
      type: string
      enum: [KICKOFF, GOAL, OWN_GOAL, PENALTY, YELLOW_CARD, RED_CARD, SUBSTITUTION, HALF_TIME, FULL_TIME, VAR]

    FixtureEvent:
      type: object
      additionalProperties: false
      required: [id, revision, minute, type, title, detail, isDeleted]
      properties:
        id:
          type: string
        revision:
          type: integer
          minimum: 0
        minute:
          type: integer
          minimum: 0
          maximum: 200
        addedTime:
          type: [integer, 'null']
          minimum: 0
        type:
          $ref: '#/components/schemas/FixtureEventType'
        title:
          $ref: '#/components/schemas/LocalizedText'
        detail:
          $ref: '#/components/schemas/LocalizedText'
        teamId:
          type: [string, 'null']
          description: When present, must identify the fixture's home or away team.
        playerId:
          type: [string, 'null']
        secondaryPlayerId:
          type: [string, 'null']
        isDeleted:
          type: boolean
          description: When true, this item is a tombstone for the stable event ID.

    FixtureEventsResponse:
      type: object
      additionalProperties: false
      required: [data, fixture, fixtureRevision, updatedAt]
      properties:
        data:
          type: array
          description: Mutations ordered by strictly increasing revision.
          items:
            $ref: '#/components/schemas/FixtureEvent'
        fixture:
          $ref: '#/components/schemas/FixtureSummary'
        fixtureRevision:
          type: integer
          minimum: 0
          description: Latest fixture revision; equal to `fixture.revision`.
        updatedAt:
          type: string
          format: date-time

    FormationPosition:
      type: object
      additionalProperties: false
      required: [line, order]
      description: |
        Normalized supplier position counted from goalkeeper toward attack.
        Positions must be unique among a team's starters. This field is only a
        visualization input; textual player data remains authoritative.
      properties:
        line:
          type: integer
          minimum: 0
          maximum: 4
        order:
          type: integer
          minimum: 0
          maximum: 4
          description: Left-to-right from the team's attacking perspective; locale direction does not mirror it.

    LineupPlayer:
      type: object
      additionalProperties: false
      required: [id, number, name, position]
      properties:
        id:
          type: string
        number:
          type: integer
          minimum: 1
          maximum: 99
        name:
          type: string
          minLength: 1
          maxLength: 120
        position:
          type: string
          enum: [GOALKEEPER, DEFENDER, MIDFIELDER, FORWARD, UNKNOWN]
        isStarter:
          type: boolean
          default: true
        formationPosition:
          description: Must be absent or null for substitutes.
          oneOf:
            - $ref: '#/components/schemas/FormationPosition'
            - type: 'null'

    Lineups:
      type: object
      additionalProperties: false
      required: [home, away]
      description: |
        IDs and shirt numbers are unique within each team and at most 11 players
        per team may be starters. A visual pitch is eligible only with exactly
        11 starters, one goalkeeper, complete unique positions and line counts
        matching the formation. Incomplete data remains a valid list-only state.
      properties:
        home:
          type: array
          maxItems: 40
          items:
            $ref: '#/components/schemas/LineupPlayer'
        away:
          type: array
          maxItems: 40
          items:
            $ref: '#/components/schemas/LineupPlayer'
        homeFormation:
          type: [string, 'null']
          pattern: '^[1-5](-[1-5]){1,3}$'
          description: Components must sum to ten outfield players.
        awayFormation:
          type: [string, 'null']
          pattern: '^[1-5](-[1-5]){1,3}$'
          description: Components must sum to ten outfield players.

    MatchStatistic:
      type: object
      additionalProperties: false
      required: [id, type, homeValue, awayValue, unit]
      description: |
        IDs and types are unique in a fixture response. POSSESSION uses `%`, is
        bounded to 0...100 per side and sums to 100 within 0.01. Other types use
        an empty unit and whole-number values. SHOTS_ON_TARGET cannot exceed
        SHOTS when both are supplied.
      properties:
        id:
          type: string
        type:
          type: string
          enum: [POSSESSION, SHOTS, SHOTS_ON_TARGET, CORNERS, FOULS, OFFSIDES, PASSES, SAVES]
        homeValue:
          type: number
          minimum: 0
        awayValue:
          type: number
          minimum: 0
        unit:
          type: string

    DataSource:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
        updatedAt:
          type: string
          format: date-time

    FixtureDetailData:
      type: object
      additionalProperties: false
      required: [fixture, events, lineups, statistics, source, updatedAt]
      properties:
        fixture:
          $ref: '#/components/schemas/FixtureSummary'
        events:
          type: array
          items:
            $ref: '#/components/schemas/FixtureEvent'
        lineups:
          $ref: '#/components/schemas/Lineups'
        statistics:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/MatchStatistic'
        source:
          $ref: '#/components/schemas/DataSource'
        updatedAt:
          type: string
          format: date-time

    FixtureDetailResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/FixtureDetailData'

    PlayerSummary:
      type: object
      additionalProperties: false
      required: [id, name, position]
      properties:
        id:
          type: string
        name:
          type: string
        position:
          type: string
        image:
          oneOf:
            - $ref: '#/components/schemas/MediaAsset'
            - type: 'null'

    PlayerListResponse:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/PlayerSummary'
        page:
          $ref: '#/components/schemas/PageInfo'

    TeamDetailResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [team, competitions, nextFixtures, recentFixtures]
          properties:
            team:
              $ref: '#/components/schemas/TeamSummary'
            competitions:
              type: array
              maxItems: 20
              description: Unique competitions referenced by either fixture window.
              items:
                $ref: '#/components/schemas/CompetitionSummary'
            nextFixtures:
              type: array
              maxItems: 10
              description: >-
                Unique SCHEDULED fixtures containing data.team, ordered by kickoffAt
                ascending then id ascending. This is a bounded channel window, not a
                complete season schedule. The embedded team snapshot must equal data.team.
              items:
                $ref: '#/components/schemas/FixtureSummary'
            recentFixtures:
              type: array
              maxItems: 10
              description: >-
                Unique FINISHED fixtures containing data.team, ordered by kickoffAt
                descending then id ascending. IDs must be disjoint from nextFixtures,
                and the embedded team snapshot must equal data.team.
              items:
                $ref: '#/components/schemas/FixtureSummary'

    TeamMatchSnapshotListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          minItems: 1
          maxItems: 20
          description: >-
            Exactly one item per requested teamId in the same order. Item team IDs
            are unique because request IDs are unique.
          items:
            $ref: '#/components/schemas/TeamMatchSnapshot'

    TeamMatchSnapshot:
      type: object
      additionalProperties: false
      required: [team, previousFixture, nextFixture]
      properties:
        team:
          $ref: '#/components/schemas/TeamSummary'
        previousFixture:
          description: >-
            Null or the nearest FINISHED fixture containing team exactly once. The
            embedded team snapshot must equal this item team.
          oneOf:
            - $ref: '#/components/schemas/FixtureSummary'
            - type: 'null'
        nextFixture:
          description: >-
            Null or the nearest SCHEDULED fixture containing team exactly once. The
            embedded team snapshot must equal this item team and its ID must differ
            from previousFixture when both are present.
          oneOf:
            - $ref: '#/components/schemas/FixtureSummary'
            - type: 'null'

    TeamContentResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [teamId, articles, videos]
          properties:
            teamId:
              type: string
              description: Must echo the requested path teamId.
            articles:
              type: array
              maxItems: 10
              description: >-
                Unique published articles explicitly associated with teamId, ordered by
                publishedAt descending then id ascending.
              items:
                $ref: '#/components/schemas/ArticleSummary'
            videos:
              type: array
              maxItems: 10
              description: >-
                Unique rights-filtered video metadata explicitly associated with teamId,
                in provider editorial order. This response grants no playback entitlement.
              items:
                $ref: '#/components/schemas/VideoSummary'

    PlayerContentResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [playerId, articles, videos]
          properties:
            playerId:
              type: string
              description: Must echo the requested path playerId.
            articles:
              type: array
              maxItems: 10
              description: >-
                Unique published articles explicitly associated with playerId, ordered by
                publishedAt descending then id ascending.
              items:
                $ref: '#/components/schemas/ArticleSummary'
            videos:
              type: array
              maxItems: 10
              description: >-
                Unique rights-filtered video metadata explicitly associated with playerId,
                in provider editorial order. This response grants no playback entitlement.
              items:
                $ref: '#/components/schemas/VideoSummary'

    CompetitionContentResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [competitionId, articles, videos]
          properties:
            competitionId:
              type: string
              description: Must echo the requested path competitionId.
            articles:
              type: array
              maxItems: 10
              description: >-
                Unique published articles explicitly associated with competitionId, ordered by
                publishedAt descending then id ascending.
              items:
                $ref: '#/components/schemas/ArticleSummary'
            videos:
              type: array
              maxItems: 10
              description: >-
                Unique rights-filtered video metadata explicitly associated with competitionId,
                in provider editorial order. This response grants no playback entitlement.
              items:
                $ref: '#/components/schemas/VideoSummary'

    FixtureContentMoment:
      type: object
      additionalProperties: false
      required: [id, title, minute, video]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        title:
          $ref: '#/components/schemas/LocalizedText'
        minute:
          type: [integer, 'null']
          minimum: 0
          maximum: 200
          description: Match minute when this item represents a timed moment.
        video:
          allOf:
            - $ref: '#/components/schemas/VideoSummary'
          description: Rights-filtered metadata only; this object grants no playback entitlement.

    FixtureContentResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [fixtureId, moments, articles]
          properties:
            fixtureId:
              type: string
              description: Must exactly echo the requested path fixtureId.
            moments:
              type: array
              maxItems: 10
              description: >-
                Unique moment and embedded video IDs explicitly associated with fixtureId,
                in provider editorial order.
              items:
                $ref: '#/components/schemas/FixtureContentMoment'
            articles:
              type: array
              maxItems: 10
              description: >-
                Unique published articles explicitly associated with fixtureId, in provider
                editorial order.
              items:
                $ref: '#/components/schemas/ArticleSummary'

    PlayerDetailResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
