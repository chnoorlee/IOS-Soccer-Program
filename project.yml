name: SportsHub

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      APS_ENVIRONMENT: development
    Release:
      APS_ENVIRONMENT: production

targets:
  SportsHub:
    type: application
    platform: iOS
    sources:
      - path: SportsHub
    info:
      path: SportsHub/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.sportshub
        PRODUCT_NAME: SportsHub
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        CODE_SIGN_ENTITLEMENTS: SportsHub/Resources/SportsHub.entitlements
        SPORTS_APP_GROUP_ID: group.com.example.sportshub.shared
        SPORTS_API_BASE_URL: https://api.example.invalid/v1
        SPORTS_AUTH_ENABLED: false
        SPORTS_COMMUNITY_ENABLED: false
        SPORTS_COMMUNITY_STANDARDS_URL: ""
        SPORTS_COMMUNITY_SUPPORT_URL: ""
        SPORTS_DATA_MODE: mock
        SPORTS_PUBLIC_WEB_BASE_URL: ""
        SPORTS_MEDIA_ALLOWED_HOSTS: ""
        SPORTS_PREMIUM_MONTHLY_PRODUCT_ID: ""
        SPORTS_PREMIUM_ANNUAL_PRODUCT_ID: ""
        SPORTS_PREMIUM_PRIVACY_URL: ""
        SPORTS_PREMIUM_TERMS_URL: ""
        SPORTS_ADVERTISING_ENABLED: false
    dependencies:
      - target: SportsHubWidgets
        embed: true

  SportsHubWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: SportsHubWidgets
      - path: SportsHub/Shared/MatchActivityAttributes.swift
      - path: SportsHub/Shared/WidgetMatchSnapshot.swift
    info:
      path: SportsHubWidgets/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.sportshub.widgets
        PRODUCT_NAME: SportsHubWidgets
        SKIP_INSTALL: true
        APPLICATION_EXTENSION_API_ONLY: true
        CODE_SIGN_ENTITLEMENTS: SportsHubWidgets/SportsHubWidgets.entitlements
        SPORTS_APP_GROUP_ID: group.com.example.sportshub.shared

  SportsHubTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SportsHubTests
    dependencies:
      - target: SportsHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.sportshub.tests
        GENERATE_INFOPLIST_FILE: true

  SportsHubUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SportsHubUITests
    dependencies:
      - target: SportsHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.sportshub.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: SportsHub

schemes:
  SportsHub:
    build:
      targets:
        SportsHub: all
        SportsHubWidgets: all
        SportsHubTests: [test]
        SportsHubUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - SportsHubTests
        - SportsHubUITests
